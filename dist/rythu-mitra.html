<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first app shell — green field header, "my field" strip, tabbed panels, bottom tab bar on phones */
:root {
  --bg: #F1F5EF;          /* field-mist neutral, green-biased */
  --surface: #FFFFFF;
  --ink: #15251B;
  --muted: #56685C;
  --line: #D6E0D6;
  --leaf: #1D6A3A;        /* paddy green */
  --leaf-soft: #E2EFE5;
  --on-leaf: #FFFFFF;
  --turmeric: #D99A00;    /* accent */
  --turmeric-soft: #FBF1D3;
  --ok: #1E7A3E;  --ok-soft: #E1F2E6;
  --warn: #9A5B00; --warn-soft: #FCEFD8;
  --bad: #B3261E;  --bad-soft: #FBE4E1;
  --display: "Baloo Tammudu 2", "Noto Sans Telugu", system-ui, sans-serif;
  --body: "Noto Sans", "Noto Sans Telugu", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1611; --surface: #16211A; --ink: #E5EEE7; --muted: #9AAE9F; --line: #2A3B30;
    --leaf: #5DBB7C; --leaf-soft: #1C3324; --on-leaf: #0B140E;
    --turmeric: #F2C14E; --turmeric-soft: #362C12;
    --ok: #6CCB8A; --ok-soft: #173322; --warn: #F0B65A; --warn-soft: #3A2A10; --bad: #F28B82; --bad-soft: #3D1916;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1611; --surface: #16211A; --ink: #E5EEE7; --muted: #9AAE9F; --line: #2A3B30;
  --leaf: #5DBB7C; --leaf-soft: #1C3324; --on-leaf: #0B140E;
  --turmeric: #F2C14E; --turmeric-soft: #362C12;
  --ok: #6CCB8A; --ok-soft: #173322; --warn: #F0B65A; --warn-soft: #3A2A10; --bad: #F28B82; --bad-soft: #3D1916;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { background: var(--leaf); color: var(--on-leaf); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1; margin: 0; letter-spacing: .01em; }
.brand p { margin: 2px 0 0; font-size: .82rem; opacity: .85; }
.lang { font-family: var(--display); font-weight: 600; font-size: 1rem; background: var(--turmeric); color: #1B1400; border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer; }
.lang:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; }

/* My field strip */
.field { background: var(--surface); border-bottom: 1px solid var(--line); }
.field .wrap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 12px; padding-block: 12px; align-items: end; }
label.f { display: grid; gap: 4px; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
select, input[type=number] { font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; text-transform: none; letter-spacing: 0; }
.season { font-family: var(--mono); font-size: .78rem; background: var(--turmeric-soft); color: var(--ink); border-radius: 6px; padding: 8px 10px; white-space: nowrap; }

/* Tabs */
.tabs { display: flex; gap: 4px; padding-block: 14px 0; }
.tab { font: inherit; font-weight: 600; font-size: .95rem; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.tab svg { width: 18px; height: 18px; }
.tab[aria-selected=true] { color: var(--leaf); border-bottom-color: var(--leaf); }
.tabline { border-bottom: 1px solid var(--line); }

main { padding-block: 22px 40px; }
.panel h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.2; margin: 0 0 4px; text-wrap: balance; }
.hint { color: var(--muted); margin: 0 0 18px; max-width: 65ch; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
.chip.sample { background: var(--turmeric-soft); color: var(--warn); }
.cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 22px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Crop doctor */
.sym { display: grid; gap: 8px; }
.sym button { font: inherit; text-align: left; display: flex; gap: 10px; align-items: flex-start; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.sym button .box { flex: none; width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--line); margin-top: 2px; display: grid; place-items: center; }
.sym button[aria-pressed=true] { border-color: var(--leaf); background: var(--leaf-soft); }
.sym button[aria-pressed=true] .box { background: var(--leaf); border-color: var(--leaf); }
.sym button[aria-pressed=true] .box::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--on-leaf); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.symhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.link { font: inherit; font-size: .85rem; background: none; border: 0; color: var(--leaf); cursor: pointer; text-decoration: underline; padding: 0; }

.dx { display: grid; gap: 14px; }
.dx-main { border: 2px solid var(--leaf); }
.dx-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dx-name { font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1.15; }
.dx-sub { font-size: .9rem; color: var(--muted); }
.meter { min-width: 84px; text-align: right; }
.meter b { font-family: var(--mono); font-size: 1.6rem; display: block; line-height: 1; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--leaf); border-radius: 3px; }
.lvl-high { color: var(--ok); } .lvl-medium { color: var(--warn); } .lvl-low { color: var(--muted); }
.dx h4 { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 14px 0 6px; }
.dx ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.dx p { margin: 0; }
.alt { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.alt .dx-name { font-size: 1.05rem; }
.safety { background: var(--turmeric-soft); border-radius: 10px; padding: 12px 14px; font-size: .86rem; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 18px; text-align: center; color: var(--muted); }

/* Weather */
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.day .d { font-weight: 700; font-size: .85rem; }
.day .t { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
.v { font-size: .75rem; font-weight: 700; border-radius: 6px; padding: 4px 6px; text-align: center; }
.v.ok { background: var(--ok-soft); color: var(--ok); } .v.caution { background: var(--warn-soft); color: var(--warn); } .v.no { background: var(--bad-soft); color: var(--bad); }
.day .why { font-size: .74rem; color: var(--muted); line-height: 1.35; }
.day.ok { border-top: 4px solid var(--ok); } .day.caution { border-top: 4px solid var(--warn); } .day.no { border-top: 4px solid var(--bad); }
.tips { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.tips li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.tips li .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; }
.dot.warn { background: var(--warn); } .dot.info { background: var(--leaf); } .dot.ok { background: var(--ok); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
td input[type=number] { width: 64px; padding: 5px 6px; font-family: var(--mono); font-size: .85rem; }
.wxgrid { display: grid; gap: 22px; margin-top: 22px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
h3 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; margin: 0 0 10px; }

/* Fertilizer */
.npk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
.big { font-family: var(--mono); font-size: 1.9rem; font-weight: 600; line-height: 1; }
td.r, th.r { text-align: right; }
tr.total td { font-weight: 700; border-bottom: 0; }
.splits { background: var(--leaf-soft); border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: .9rem; }

/* Mandi */
.inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.best { display: grid; gap: 4px; }
.best .big { color: var(--leaf); }
tr.top td { background: var(--leaf-soft); font-weight: 600; }
.tag { font-size: .7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.tag.below { background: var(--bad-soft); color: var(--bad); } .tag.above { background: var(--ok-soft); color: var(--ok); }
.alert { background: var(--bad-soft); color: var(--ink); border-left: 4px solid var(--bad); border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
.mspbox { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
svg.spark { width: 84px; height: 26px; display: block; }
.up { color: var(--ok); } .down { color: var(--bad); }

footer { color: var(--muted); font-size: .8rem; padding-block: 18px 90px; border-top: 1px solid var(--line); }

/* Phone */
@media (max-width: 760px) {
  .field .wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .season { grid-column: 1 / -1; text-align: center; }
  .cols, .wxgrid { grid-template-columns: minmax(0, 1fr); }
  .days { grid-template-columns: minmax(0, 1fr); }
  .day { grid-template-columns: 76px 1fr; align-items: center; column-gap: 12px; }
  .day .why { grid-column: 2; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
          padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); gap: 0; }
  .tab { flex: 1; flex-direction: column; gap: 2px; font-size: .68rem; padding: 6px 2px; border-bottom: 0; border-top: 3px solid transparent; text-align: center; }
  .tab[aria-selected=true] { border-top-color: var(--leaf); background: var(--leaf-soft); border-radius: 8px; }
  .tab svg { width: 22px; height: 22px; }
  .tabline { border: 0; }
  .npk { grid-template-columns: minmax(0, 1fr); }
  .brand h1 { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .35s ease; }
  .sym button { transition: background .15s, border-color .15s; }
}
</style>

<section class="field" aria-label="My field">

    <label class="f"><span data-t="district"></span><select id="district"></select></label>
    <label class="f"><span data-t="acres"></span><input id="acres" type="number" min="0.25" max="100" step="0.25" value="2"></label>
    <span class="season" data-t="season"></span>
  </div>
</section>

<div class="tabline"><nav class="wrap tabs" role="tablist" id="tabs"></nav></div>

<main class="wrap">

  <section class="panel" id="p-weather" role="tabpanel" hidden></section>

</main>

<script>
/* Rythu Mitra — decision engines (pure functions, no DOM).
 * Works in the browser (window.Engine) and in Node (require) for testing.
 */
(function (root) {
  const KB = (typeof module !== "undefined" && module.exports) ? require("./data.js") : root.KB;
  const HA_PER_ACRE = 2.471;

  /* ---------- 1. Crop Doctor: weighted symptom matching ---------- */
  function diagnose(crop, selected) {
    const picked = new Set(selected);
    if (!picked.size) return [];
    const list = KB.DISEASES[crop] || [];
    return list.map(d => {
      const ids = Object.keys(d.w);
      const total = ids.reduce((s, id) => s + d.w[id], 0);
      const matched = ids.filter(id => picked.has(id));
      const matchedW = matched.reduce((s, id) => s + d.w[id], 0);
      // coverage: how much of this disease's pattern is present
      // focus: how many of the farmer's symptoms this disease explains
      const coverage = matchedW / total;
      const focus = matched.length / picked.size;
      const score = Math.round(100 * coverage * (0.75 + 0.25 * focus));
      return { disease: d, score, matched, level: score >= 70 ? "high" : score >= 40 ? "medium" : "low" };
    })
    .filter(r => r.matched.length && r.score >= 15)
    .sort((a, b) => b.score - a.score);
  }

  /* ---------- 2. Fertilizer calculator ---------- */
  function fertilizer(npkHa, acres) {
    const P = KB.PRODUCTS;
    const perAcre = { n: npkHa.n / HA_PER_ACRE, p: npkHa.p / HA_PER_ACRE, k: npkHa.k / HA_PER_ACRE };
    const need = { n: perAcre.n * acres, p: perAcre.p * acres, k: perAcre.k * acres };
    // DAP supplies all phosphorus and part of the nitrogen; urea makes up the rest of N; MOP supplies K.
    const dapKg = need.p / P.dap.p;
    const nFromDap = dapKg * P.dap.n;
    const ureaKg = Math.max(0, need.n - nFromDap) / P.urea.n;
    const mopKg = need.k / P.mop.k;
    const item = (key, kg) => {
      const bags = kg / P[key].bag;
      const buyBags = Math.ceil(bags - 1e-9);
      return { key, kg, bags, buyBags, cost: buyBags * P[key].price };
    };
    const items = [item("urea", ureaKg), item("dap", dapKg), item("mop", mopKg)].filter(i => i.kg > 0.05);
    return { perAcre, need, items, total: items.reduce((s, i) => s + i.cost, 0) };
  }

  /* ---------- 3. Weather & spray advisory ---------- */
  function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

  function sampleForecast(district, start) {
    const shift = hash(district) % 3;
    const dt = (hash(district + "t") % 3) - 1;
    return KB.WEATHER_BASE.map((_, i) => {
      const b = KB.WEATHER_BASE[(i + shift) % KB.WEATHER_BASE.length];
      const d = new Date(start); d.setDate(d.getDate() + i);
      return { date: d, tmax: b.tmax + dt, tmin: b.tmin + dt, rain: b.rain, prob: b.prob, wind: b.wind, rh: b.rh };
    });
  }

  /* Rules from standard plant-protection practice:
     - no spraying when rain is likely (it washes the chemical off)
     - no spraying above 15 km/h wind (drift)
     - in heat (>= 35 °C) spray only early morning or evening */
  function sprayVerdict(day, next) {
    if (day.rain >= 5 || day.prob >= 60) return { level: "no", reason: "rain" };
    if (day.wind > 15) return { level: "no", reason: "wind" };
    if (next && (next.rain >= 10 || next.prob >= 70)) return { level: "caution", reason: "rainNext" };
    if (day.tmax >= 35) return { level: "caution", reason: "heat" };
    return { level: "ok", reason: "good" };
  }

  function fieldTips(days, crop) {
    const tips = [];
    const heavy = days.slice(0, 3).find(d => d.rain >= 15);
    if (heavy) tips.push({ key: "holdUrea", sev: "warn", day: heavy.date });
    const humidDays = days.filter(d => d.rh >= 85 && d.tmin >= 18);
    if (humidDays.length) tips.push({ key: "fungal_" + crop, sev: "warn", day: humidDays[0].date });
    const totalRain = days.reduce((s, d) => s + d.rain, 0);
    const hot = days.filter(d => d.tmax >= 33).length;
    if (totalRain < 5 && hot >= 3) tips.push({ key: "irrigate", sev: "info" });
    else if (totalRain >= 20) tips.push({ key: "drain", sev: "info" });
    if (crop === "paddy" && days.some(d => d.tmin <= 15)) tips.push({ key: "coldNursery", sev: "warn" });
    const best = days.find(d => sprayVerdict(d, days[days.indexOf(d) + 1]).level === "ok");
    if (best) tips.push({ key: "bestSpray", sev: "ok", day: best.date });
    return tips;
  }

  /* ---------- 4. Mandi: best market after transport ---------- */
  function priceSeries(crop, market) {
    const base = KB.MANDI_BASE[crop].base;
    const h = hash(market + crop);
    const factor = 1 + ((h % 7) - 3) / 100;                       // ±3% market premium/discount
    const drift = ((hash(crop) % 5) - 2) / 1000;                  // small weekly trend
    return Array.from({ length: 7 }, (_, i) =>
      Math.round(base * factor * (1 + Math.sin(i * 0.9 + (h % 10)) * 0.012 + drift * i) / 5) * 5);
  }

  function bestMarket(crop, home, qty, ratePerKm) {
    const msp = KB.MSP[crop];
    const rows = KB.MANDI_BASE[crop].markets.map(m => {
      const series = priceSeries(crop, m);
      const modal = series[series.length - 1];
      const km = KB.DIST_KM[home][m];
      const transport = km * ratePerKm;                            // ₹ per quintal
      const net = modal - transport;
      return { market: m, series, modal, km, transport, net, gross: modal * qty, netTotal: net * qty,
               belowMsp: msp ? modal < msp : false, change: modal - series[series.length - 2] };
    }).sort((a, b) => b.net - a.net);
    const best = rows[0];
    const mspAdvice = msp && best.net < msp
      ? { msp, gapPerQtl: msp - best.net, extra: (msp - best.net) * qty } : null;
    return { rows, best, msp, mspAdvice };
  }

  const Engine = { diagnose, fertilizer, sampleForecast, sprayVerdict, fieldTips, priceSeries, bestMarket, HA_PER_ACRE };
  if (typeof module !== "undefined" && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(this);
</script>

      <div class="cols">
        <div>
          <div class="symhead"><span class="muted num">${p.size} / ${syms.length}</span><button class="link" id="clearSym" type="button">${t("clear")}</button></div>
          <div class="sym" id="symList">${syms.map(s =>
            `<button type="button" data-sym="${s.id}" aria-pressed="${p.has(s.id)}"><span class="box"></span><span>${esc(nm(s))}</span></button>`).join("")}</div>
        </div>
        <div id="dxOut"></div>
      </div>`;
    renderDiagnosis();
  }

  function renderDiagnosis() {
    const p = picked();
    const out = $("#dxOut");
    if (!p.size) { out.innerHTML = `<div class="empty">${t("docEmpty")}</div>`; return; }
    const res = Engine.diagnose(S.crop, [...p]);
    if (!res.length) { out.innerHTML = `<div class="empty">${t("docNoMatch")}</div>`; return; }
    const symName = id => nm(SYMPTOMS[S.crop].find(s => s.id === id));
    const [top, ...rest] = res;
    const d = top.disease;
    out.innerHTML = `<div class="dx">
      <div class="card dx-main">
        <div class="dx-top">
          <div><div class="dx-sub">${t("likely")} · ${t("type_" + d.type)}</div>
            <div class="dx-name">${esc(nm(d))}</div>
            <div class="dx-sub">${S.lang === "te" ? esc(d.en) : esc(d.te)}</div></div>
          <div class="meter"><b class="lvl-${top.level}">${top.score}%</b><span class="dx-sub">${t("lvl_" + top.level)}</span></div>
        </div>
        <div class="bar"><i style="width:${top.score}%"></i></div>
        <h4>${t("signsMatched")}</h4><p>${top.matched.map(id => esc(symName(id))).join(" · ")}</p>
        <h4>${t("whatToDo")}</h4><ol>${d.act.map(a => `<li>${esc(a)}</li>`).join("")}</ol>
        <h4>${t("organic")}</h4><p>${esc(d.organic)}</p>
        <h4>${t("prevent")}</h4><p>${esc(d.prevent)}</p>
      </div>
      ${rest.length ? `<div class="card"><h4 style="margin-top:0">${t("alsoCheck")}</h4>${rest.map(r =>
        `<div class="alt"><div><div class="dx-name">${esc(nm(r.disease))}</div><div class="dx-sub">${t("type_" + r.disease.type)}</div></div>
         <div class="num lvl-${r.level}">${r.score}%</div></div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:10px 0">')}</div>` : ""}
      <div class="safety">${t("safety")}</div>
    </div>`;
  }

  /* ---------- 2. Weather & spray ---------- */
  function ensureForecast() {
    if (!S.forecast || S.forecast.district !== S.district) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      S.forecast = { district: S.district, days: Engine.sampleForecast(S.district, today) };
    }
    return S.forecast.days;
  }

  function renderWeather() {
    const days = ensureForecast();
    const fields = ["rain", "prob", "wind", "rh", "tmax"];
    $("#p-weather").innerHTML = `
      <h2>${t("wxTitle")} · ${esc(nm(DISTRICTS[S.district]))}</h2>
      <p class="hint"><span class="chip sample">${t("sample")}</span> ${t("wxHint")}</p>
      <div class="days" id="dayCards"></div>
      <div class="wxgrid">
        <div><h3>${t("tipsTitle")}</h3><ul class="tips" id="tips"></ul></div>
        <div><h3>${t("wxEdit")}</h3>
          <div class="card scroll" style="padding:6px 10px"><table>
            <thead><tr><th></th>${fields.map(f => `<th>${t(f)}</th>`).join("")}</tr></thead>
            <tbody>${days.map((d, i) => `<tr><td>${esc(fmtDay(d.date))}</td>${fields.map(f =>
              `<td><input type="number" id="wx-${i}-${f}" data-i="${i}" data-f="${f}" value="${d[f]}" min="0" max="${f === "prob" || f === "rh" ? 100 : 60}" aria-label="${t(f)} ${esc(fmtDay(d.date))}"></td>`).join("")}</tr>`).join("")}</tbody>
          </table></div></div>
      </div>`;
    renderWeatherResults();
  }

  function renderWeatherResults() {
    const days = S.forecast.days;
    $("#dayCards").innerHTML = days.map((d, i) => {
      const v = Engine.sprayVerdict(d, days[i + 1]);
      return `<div class="day ${v.level}">
        <div><div class="d">${esc(fmtDay(d.date))}</div><div class="t">${d.tmax}°/${d.tmin}° · ${d.rain} mm · ${d.wind} km/h</div></div>
        <div class="v ${v.level}">${t("v_" + v.level)}</div>
        <div class="why">${t("r_" + v.reason)}</div></div>`;
    }).join("");
    const tips = Engine.fieldTips(days, S.crop);
    $("#tips").innerHTML = tips.map(tp => `<li><span class="dot ${tp.sev}"></span><span>${esc(t("t_" + tp.key, { day: tp.day ? fmtDay(tp.day) : "" }))}</span></li>`).join("");
  }

  /* ---------- 3. Fertilizer ---------- */
  function npk() { return S.npk[S.crop] || { ...NPK_HA[S.crop] }; }

  function renderFert() {
    const v = npk();
    $("#p-fert").innerHTML = `
      <h2>${t("fTitle")} · ${esc(nm(CROPS[S.crop]))}, <span class="num">${S.acres}</span> ${S.lang === "te" ? "ఎకరాలు" : "acres"}</h2>
      <p class="hint">${t("fHint")}</p>
      <div class="cols">
        <div class="card">
          <h3>${t("perHa")}</h3>
          <div class="npk">${["n", "p", "k"].map(x =>
            `<label class="f"><span>${t(x)}</span><input type="number" id="npk-${x}" data-x="${x}" min="0" max="400" value="${v[x]}"></label>`).join("")}</div>
          <button class="link" id="npkReset" type="button">${t("reset")}</button>
          <div class="splits"><b>${t("when")}:</b> ${esc(NPK_HA[S.crop].splits)}</div>
        </div>
        <div class="card" id="fertOut"></div>
      </div>`;
    renderFertResults();
  }

  function renderFertResults() {
    const r = Engine.fertilizer(npk(), S.acres);
    $("#fertOut").innerHTML = `
      <div class="scroll"><table>
        <thead><tr><th>${t("product")}</th><th class="r">${t("kg")}</th><th class="r">${t("bags")}</th><th class="r">${t("cost")}</th></tr></thead>
        <tbody>${r.items.map(i => `<tr><td>${t(i.key)}</td><td class="r num">${i.kg.toFixed(1)}</td>
          <td class="r num"><b>${i.buyBags}</b> <span class="muted">(${i.bags.toFixed(2)} × ${PRODUCTS[i.key].bag} kg)</span></td><td class="r num">₹${inr(i.cost)}</td></tr>`).join("")}
          <tr class="total"><td>${t("total")}</td><td></td><td></td><td class="r num">₹${inr(r.total)}</td></tr></tbody>
      </table></div>
      <p class="muted" style="font-size:.8rem;margin:12px 0 0">${t("fNote")}</p>`;
  }

  /* ---------- 4. Mandi ---------- */
  function spark(series) {
    const w = 84, h = 26, min = Math.min(...series), max = Math.max(...series), span = max - min || 1;
    const pts = series.map((v, i) => [2 + i * (w - 4) / (series.length - 1), h - 3 - (v - min) / span * (h - 6)]);
    const last = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--leaf)" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--turmeric)"/></svg>`;
  }

  function renderMandi() {
    $("#p-mandi").innerHTML = `
      <h2>${t("mTitle")} · ${esc(nm(CROPS[S.crop]))}</h2>
      <p class="hint"><span class="chip sample">${t("sample")}</span> ${t("mHint")}</p>
      <div class="cols">
        <div class="card">
          <div class="inputs">
            <label class="f"><span>${t("qty")}</span><input type="number" id="qty" min="1" max="5000" value="${S.qty}"></label>
            <label class="f"><span>${t("rate")}</span><input type="number" id="rate" min="0" max="10" step="0.1" value="${S.rate}"></label>
          </div>
          <div id="bestBox" style="margin-top:16px"></div>
        </div>
        <div class="card scroll" id="mandiTable" style="padding:6px 10px"></div>
      </div>`;
    renderMandiResults();
  }

  function renderMandiResults() {
    const r = Engine.bestMarket(S.crop, S.district, S.qty, S.rate);
    const mk = m => esc(nm(DISTRICTS[m]) === DISTRICTS[m].en ? DISTRICTS[m].market : nm(DISTRICTS[m]));
    $("#bestBox").innerHTML = `
      <div class="best"><span class="chip sample" style="justify-self:start">${t("best")}</span>
        <div class="dx-name">${mk(r.best.market)}</div>
        <div class="big num">₹${inr(r.best.net)}<span class="muted" style="font-size:.9rem"> / qtl</span></div>
        <p style="margin:4px 0 0">${t("bestLine", { qty: S.qty, market: mk(r.best.market), total: inr(r.best.netTotal) })}</p></div>
      <div class="mspbox"><span class="muted">${t("msp")}</span><span class="num"><b>${r.msp ? "₹" + inr(r.msp) : t("noMsp")}</b></span></div>
      ${r.mspAdvice ? `<div class="alert">${t("mspAlert", { gap: inr(r.mspAdvice.gapPerQtl), qty: S.qty, where: nm(PROCURER[S.crop]), extra: inr(r.mspAdvice.extra) })}</div>` : ""}`;
    $("#mandiTable").innerHTML = `<table>
      <thead><tr><th>${t("market")}</th><th class="r">${t("modal")}</th><th>${t("trend")}</th><th class="r">${t("km")}</th><th class="r">${t("net")}</th></tr></thead>
      <tbody>${r.rows.map((row, i) => `<tr class="${i === 0 ? "top" : ""}">
        <td>${mk(row.market)}${r.msp ? `<br><span class="tag ${row.belowMsp ? "below" : "above"}">${t(row.belowMsp ? "belowMsp" : "aboveMsp")}</span>` : ""}</td>
        <td class="r num">₹${inr(row.modal)}<br><span class="${row.change >= 0 ? "up" : "down"}" style="font-size:.75rem">${row.change >= 0 ? "▲" : "▼"} ${inr(Math.abs(row.change))}</span></td>
        <td>${spark(row.series)}</td>
        <td class="r num">${row.km} km</td>
        <td class="r num"><b>₹${inr(row.net)}</b></td></tr>`).join("")}</tbody></table>`;
  }

  /* ---------- wiring ---------- */
  const PANELS = { doctor: renderDoctor, weather: renderWeather, fert: renderFert, mandi: renderMandi };
  function renderAll() { renderStatic(); renderTabs(); Object.values(PANELS).forEach(f => f()); }

  document.addEventListener("click", e => {
    const tab = e.target.closest("[data-tab]");
    if (tab) { S.tab = tab.dataset.tab; renderTabs(); window.scrollTo({ top: 0 }); return; }
    const sym = e.target.closest("[data-sym]");
    if (sym) { const p = picked(), id = sym.dataset.sym; p.has(id) ? p.delete(id) : p.add(id);
      sym.setAttribute("aria-pressed", p.has(id)); $(".symhead .num").textContent = `${p.size} / ${SYMPTOMS[S.crop].length}`; renderDiagnosis(); return; }
    if (e.target.id === "clearSym") { picked().clear(); renderDoctor(); return; }
    if (e.target.id === "npkReset") { delete S.npk[S.crop]; renderFert(); return; }
    if (e.target.id === "lang") { S.lang = S.lang === "en" ? "te" : "en"; save(); renderAll(); }
  });

  document.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.f !== undefined && el.dataset.i !== undefined) {
      const v = parseFloat(el.value); if (isNaN(v)) return;
      S.forecast.days[+el.dataset.i][el.dataset.f] = v; renderWeatherResults(); return;
    }
    if (el.dataset.x) { const v = parseFloat(el.value); if (isNaN(v) || v < 0) return;
      S.npk[S.crop] = { ...npk(), [el.dataset.x]: v }; renderFertResults(); return; }
    if (el.id === "qty" || el.id === "rate") { const v = parseFloat(el.value); if (isNaN(v) || v < 0) return;
      S[el.id] = v; renderMandiResults(); return; }
    if (el.id === "acres") { const v = parseFloat(el.value); if (isNaN(v) || v <= 0) return; S.acres = v; save(); renderFert(); }
  });

  document.addEventListener("change", e => {
    if (e.target.id === "crop") { S.crop = e.target.value; save(); Object.values(PANELS).forEach(f => f()); }
    if (e.target.id === "district") { S.district = e.target.value; save(); renderWeather(); renderMandi(); }
  });

  /* Demo starts with two signs picked so the Crop Doctor shows a result straight away */
  if (S.crop === "paddy") S.picked.paddy = new Set(["p_spindle", "humid"]);
  renderAll();
})();
</script>
